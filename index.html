<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Терешківській школі математичний релакс: Черепашка-художник</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #F0F8FF;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #toolbar {
            height: 60px;
            background-color: #F0F8FF;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        button {
            padding: 8px 15px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-sketch { background-color: #E6E6FA; }
        .btn-color { background-color: #98FB98; }
        .btn-sky { background-color: #87CEEB; }
        .btn-clear { background-color: #CD5C5C; color: white; margin-left: auto; }
        button:hover { opacity: 0.8; }
        
        #canvas-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #F0F8FF;
        }
        canvas {
            background-color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div id="toolbar">
        <button class="btn-sketch" onclick="runSketch()">1. Намалювати ескіз</button>
        <button class="btn-color" onclick="runColor()">2. Розфарбувати</button>
        <button class="btn-sky" onclick="makeSkyBlue()">Змінити небо на вечірнє</button>
        <button class="btn-clear" onclick="clearCanvas()">Очистити все</button>
    </div>

    <div id="canvas-container">
        <canvas id="myCanvas" width="900" height="500"></canvas>
    </div>

<script>
    const canvas = document.getElementById("myCanvas");
    const ctx = canvas.getContext("2d");

    let currentBgColor = "white";
    let isSketchMode = false;
    let waveOffset1 = 0; // Зсув для першої хвилі (вправо)
    let waveOffset2 = 0; // Зсув для другої хвилі (вліво)
    let animationId = null; // Для керування циклом анімації

    function clearCanvas() {
        ctx.fillStyle = currentBgColor;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    clearCanvas();

    // 1. Сонце з променями
    function drawSun(x, y, isSketch) {
        ctx.beginPath();
        ctx.arc(x, y, 25, 0, Math.PI * 2);
        if (isSketch) {
            ctx.strokeStyle = "gray";
            ctx.lineWidth = 1;
            ctx.stroke();
        } else {
            ctx.fillStyle = "#FFF8DC";
            ctx.fill();
            ctx.strokeStyle = "#FFD700";
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        for (let i = 0; i < 8; i++) {
            let angle = (i * 45) * Math.PI / 180;
            let x1 = x + Math.cos(angle) * 25;
            let y1 = y + Math.sin(angle) * 25;
            let x2 = x + Math.cos(angle) * 40;
            let y2 = y + Math.sin(angle) * 40;

            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.strokeStyle = isSketch ? "gray" : "#FFA500";
            ctx.lineWidth = isSketch ? 1 : 3;
            ctx.stroke();
        }
    }

    // 2. Човен
    function drawBoat(x, y, boatColor, sailColor, isSketch) {
        ctx.beginPath();
        ctx.moveTo(x - 30, y);
        ctx.lineTo(x + 110, y);
        ctx.lineTo(x + 80, y + 45);
        ctx.lineTo(x, y + 45);
        ctx.closePath();

        if (isSketch) {
            ctx.strokeStyle = "gray";
            ctx.lineWidth = 1;
            ctx.stroke();
        } else {
            ctx.fillStyle = "#D2B48C";
            ctx.fill();
            ctx.strokeStyle = boatColor;
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        // Вітрило
        ctx.beginPath();
        ctx.moveTo(x + 40, y);
        ctx.lineTo(x + 40, y - 65);
        ctx.lineTo(x + 90, y - 25);
        ctx.closePath();

        if (isSketch) {
            ctx.strokeStyle = "gray";
            ctx.lineWidth = 1;
            ctx.stroke();
        } else {
            ctx.fillStyle = "#FFA07A";
            ctx.fill();
            ctx.strokeStyle = sailColor;
            ctx.lineWidth = 3;
            ctx.stroke();
        }
    }

    // 3. Досконалий кит
    function drawWhale(x, y, color, isSketch) {
        ctx.beginPath();
        ctx.arc(x, y, 45, Math.PI, 0, false);
        ctx.lineTo(x + 55, y + 25);
        ctx.lineTo(x - 45, y + 25);
        ctx.closePath();

        if (isSketch) {
            ctx.strokeStyle = "gray";
            ctx.lineWidth = 1;
            ctx.stroke();
        } else {
            ctx.fillStyle = "#3CB371";
            ctx.fill();
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        // Хвіст
        ctx.beginPath();
        ctx.moveTo(x + 50, y + 10);
        ctx.lineTo(x + 85, y - 10);
        ctx.lineTo(x + 75, y + 15);
        ctx.lineTo(x + 85, y + 35);
        ctx.lineTo(x + 50, y + 20);
        ctx.closePath();

        if (isSketch) {
            ctx.strokeStyle = "gray";
            ctx.lineWidth = 1;
            ctx.stroke();
        } else {
            ctx.fillStyle = "#3CB371";
            ctx.fill();
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            ctx.stroke();

            // Око
            ctx.beginPath();
            ctx.arc(x - 20, y - 10, 5, 0, Math.PI * 2);
            ctx.fillStyle = "white";
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(x - 22, y - 10, 2, 0, Math.PI * 2);
            ctx.fillStyle = "black";
            ctx.fill();

            // Фонтанчик
            ctx.beginPath();
            ctx.moveTo(x - 5, y - 45);
            ctx.quadraticCurveTo(x - 15, y - 70, x - 25, y - 60);
            ctx.moveTo(x - 5, y - 45);
            ctx.quadraticCurveTo(x + 5, y - 75, x + 15, y - 65);
            ctx.strokeStyle = "#00BFFF";
            ctx.lineWidth = 2;
            ctx.stroke();
        }
    }

    // 4. Динамічні хвилі зі зсувом (offset)
    function drawMovingWaves(startX, y, color, isSketch, offset) {
        ctx.save();
        // Обрізаємо область малювання, щоб хвилі не виходили за межі екрана
        ctx.beginPath();
        ctx.rect(50, y - 30, 800, 60);
        ctx.clip();

        ctx.beginPath();
        // Цикл із запасом для безперервного руху
        let baseStartX = startX + (offset % 30);
        ctx.moveTo(baseStartX - 60, y);

        for (let i = -2; i < 30; i++) {
            let x = baseStartX + i * 30;
            ctx.bezierCurveTo(x + 10, y - 15, x + 20, y - 15, x + 30, y);
        }
        ctx.strokeStyle = isSketch ? "gray" : color;
        ctx.lineWidth = isSketch ? 1 : 2;
        ctx.stroke();
        ctx.restore();
    }

    // 5. Чайки у небі
    function drawGull(x, y, isSketch) {
        ctx.beginPath();
        ctx.moveTo(x - 20, y - 10);
        ctx.quadraticCurveTo(x - 10, y - 20, x, y);
        ctx.quadraticCurveTo(x + 10, y - 20, x + 20, y - 10);
        ctx.strokeStyle = isSketch ? "gray" : "#555555";
        ctx.lineWidth = isSketch ? 1 : 2;
        ctx.stroke();
    }

    // Головний цикл анімації руху хвиль
    function startWaveAnimation() {
        if (animationId) cancelAnimationFrame(animationId);

        function renderFrame() {
            clearCanvas();

            // Оновлюємо зсуви координат: перша хвиля вправо (+), друга вліво (-)
            waveOffset1 += 0.5;
            waveOffset2 -= 0.5;

            // Перемальовуємо сцену
            drawSun(130, 100, isSketchMode);
            drawMovingWaves(80, 355, "blue", isSketchMode, waveOffset1);
            drawMovingWaves(80, 370, "cyan", isSketchMode, waveOffset2);
            drawBoat(280, 315, "brown", "red", isSketchMode);
            drawWhale(620, 345, "darkblue", isSketchMode);
            drawGull(320, 90, isSketchMode);
            drawGull(400, 70, isSketchMode);
            drawGull(480, 100, isSketchMode);

            animationId = requestAnimationFrame(renderFrame);
        }

        renderFrame();
    }

    // Покрокова поява об'єктів перед запуском постійного руху
    function animateDrawing(isSketch) {
        if (animationId) cancelAnimationFrame(animationId);
        isSketchMode = isSketch;
        clearCanvas();
        
        let step = 0;
        let timer = setInterval(() => {
            step++;
            if (step === 1) drawSun(130, 100, isSketch);
            if (step === 2) {
                drawMovingWaves(80, 355, "blue", isSketch, 0);
                drawMovingWaves(80, 370, "cyan", isSketch, 0);
            }
            if (step === 3) drawBoat(280, 315, "brown", "red", isSketch); 
            if (step === 4) drawWhale(620, 345, "darkblue", isSketch);   
            if (step === 5) {
                drawGull(320, 90, isSketch);
                drawGull(400, 70, isSketch);
                drawGull(480, 100, isSketch);
                clearInterval(timer);
                
                // Після завершення покрокового малювання запускаємо зациклений рух хвиль!
                startWaveAnimation();
            }
        }, 250);
    }

    function runSketch() {
        animateDrawing(true);
    }

    function runColor() {
        animateDrawing(false);
    }

    function makeSkyBlue() {
        currentBgColor = "#E0FFFF";
        if (!animationId) clearCanvas();
    }

    function clearCanvasFull() {
        if (animationId) cancelAnimationFrame(animationId);
        animationId = null;
        currentBgColor = "white";
        clearCanvas();
    }
</script>
</body>
</html>
